name: Local regressions

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v7
        with:
          go-version-file: lib/remote-gateway/go.mod
          cache: false
      - name: Select macOS 26 or newer SDK
        run: |
          python3 - <<'PY'
          import os, plistlib
          from pathlib import Path
          choices = []
          for app in Path('/Applications').glob('Xcode*.app'):
              settings = app / 'Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk/SDKSettings.plist'
              if settings.is_file():
                  version = tuple(int(part) for part in plistlib.loads(settings.read_bytes())['Version'].split('.'))
                  if version[0] >= 26:
                      choices.append((version, str(app.resolve() / 'Contents/Developer')))
          if not choices:
              raise SystemExit('Full Mac checks require a macOS 26 or newer SDK')
          version, developer = max(choices)
          with Path(os.environ['GITHUB_ENV']).open('a') as stream:
              stream.write('DEVELOPER_DIR=' + developer + '\n')
          print('Selected SDK', version, developer)
          PY
      - run: ./scripts/check.sh

  relay-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/relay/go.mod
          cache: false
      - run: go -C server/relay test -race ./...
      - run: go -C lib/android/terminal test -race ./...
      - run: go -C lib/remote-gateway test -race -tags relaycontract -run '^(TestRelayContractHarness|TestRepositoryRelayContract)$' .
